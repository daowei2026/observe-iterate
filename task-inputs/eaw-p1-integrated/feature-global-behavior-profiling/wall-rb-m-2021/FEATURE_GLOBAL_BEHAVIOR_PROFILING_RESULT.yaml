  global_finding_candidates:
    - finding_id: GF-001
      finding_type: STRUCTURAL_FINDING_CANDIDATE
      feature_ref: FUP-EAW-WALL-20261120-01
      run_binding: wall-rb-m-2021
      reasonableness_unit_ref: Wall occurrence identity and idempotence
      business_object_ref: WallLifecycleOccurrence / OccurrenceRef
      observation: >-
        132 groups contain two BandUpdate rows with the same symbol, wall_id, UTI and event_type_code,
        but different band/core payloads. Physical occurrence_ordinal distinguishes the rows, while the
        current typed business OccurrenceRef contract omits ordinal.
      structural_invariant_ref: >-
        One business OccurrenceRef must not identify two different payloads within one feature-run namespace.
      evidence_scope:
        symbols: [rb, m]
        period: 2021 post-QT sample
        detail_ref: DUPLICATE_BUSINESS_OCCURRENCE_REFS.csv
      repeat_count: 132
      affected_count: 125
      affected_ratio: 0.001255
      representative_locations:
        - {symbol: rb, wall_id: 3527, timestamp: '2021-03-24 14:30:18.000', uti: 74165435}
        - {symbol: rb, wall_id: 3893, timestamp: '2021-03-26 11:06:27.000', uti: 74238173}
        - {symbol: m, wall_id: 9878, timestamp: '2021-06-23 14:18:40.500', uti: 76604840}
      alternative_non_error_explanations:
        - A formally adopted identity contract may include physical ordinal or otherwise define the two rows as distinct business occurrences.
      current_confidence: HIGH
      next_route: BUSINESS_DISCREPANCY_DIAGNOSIS
