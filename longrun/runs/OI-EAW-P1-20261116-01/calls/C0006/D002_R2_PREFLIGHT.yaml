status_semantics:
  ELIGIBLE: Required evidence is valid, meaning-clear and fit for the named formal-R2 purpose.
  PARTIAL: Some evidence is usable, but one or more required layers remain incomplete.
  PROVEN_UNAVAILABLE: The named formal evidence is absent in the frozen source after bounded investigation and no authority-preserving derivation can replace it.
  BLOCKED: Access, permission or an unauthorized high-impact action prevents bounded determination.

