evidence_dependency_rules:
  - rule: window_evidence and source frame are the same evidence lineage
    action: do not double count
  - rule: wall_segments are rendering intervals derived from Wall lifecycle
    action: do not count as independent lifecycle evidence
  - rule: tactical and structural F4 overlap refers to the same half-second material
    action: do not count as two occurrences
  - rule: review-only union is derived from the two lane tables
    action: not an independent source and not a product
  - rule: current TIS/FRP contracts are implementation evidence unbound to the frozen ZIP
    action: do not use them to assert frozen-run parameters or outputs

formal_r2_unlock_minimum:
  - authoritative frozen-run receipt/manifest binding source scope, code/config/parameters and product artifacts
  - complete availability/missingness representation for the selected product scope
  - corrected complete AttackSegment export with business_end and closed_at
  - canonical F4 product if E-BIZ-P1-007 remains in formal comparison scope
  - direct FormationEvidence/Barrier/F3 artifacts or an explicit manager-approved MISSING/PROVEN_UNAVAILABLE formal-comparison plan
  - Absorb export carrying milestone level and valid typed Wall/interaction identity, or a scope rule excluding pre-interaction quote-track terminations

non_claims:
  - no formal SUPPORTS or COUNTERS
  - no H2 or G-COMPARISON decision
  - no FrozenExpectationSet v1 modification
  - no product reasonable/unreasonable judgment
  - no parent task completion declaration
