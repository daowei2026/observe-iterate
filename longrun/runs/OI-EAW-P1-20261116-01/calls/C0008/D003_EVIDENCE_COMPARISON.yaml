status_semantics:
  SUPPORTS: 适用条件成立，证据有效、含义明确且适合当前目的，并与冻结命题一致。
  COUNTERS: 排除数据、身份、时间、导出阶段和实现缺陷后，合格证据仍与命题冲突。
  MISSING: 当前冻结源中，判断所需正式产品、字段、时间、版本或样本不可得。
  AMBIGUOUS: 真实证据存在多个仍合理且当前无法区分的解释。
  NOT_APPLICABLE: 场景不满足冻结命题的适用条件。
  PENDING: 过程或 confirmTime 尚未完成。

finding_layers:
  ARTIFACT_CONFORMANCE: frozen export 的字段、时间、identity、availability 合同。
  MATERIAL_METHOD: 图、窗口、派生视图是否适合承担证据。
  BUSINESS_REASONABLENESS: 合格正式产品行为是否支持或反驳冻结业务预期。

