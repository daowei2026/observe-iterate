evidence_dependency_rules:
  - window_evidence and source frame are one lineage; do not double count.
  - wall_segments are rendering intervals derived from Wall lifecycle; do not count independently.
  - tactical/structural F4 overlap is the same half-second material; do not count as two occurrences.
  - review-only F4 union is derived, non-independent and NOT_CANONICAL_PRODUCT.
  - current TIS/FRP contracts are unbound implementation evidence, not frozen-run support.
  - local IDs are symbol/package scoped and are not cross-run typed identity.

