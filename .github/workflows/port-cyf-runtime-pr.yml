name: Port CYF runtime on migration PR

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/import_cyf_runtime.py
      - .github/workflows/port-cyf-runtime.yml

permissions:
  contents: write

concurrency:
  group: port-cyf-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  port:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout locked CYF source
        uses: actions/checkout@v4
        with:
          repository: daowei2026/feature-refinement-implementation-agent-evolution
          ref: c6a930887c9148e76ba75f8a026549b9a46c9e35
          path: source
          fetch-depth: 1

      - name: Build exact upstream copy and adapted canonical runtime
        run: python target/scripts/import_cyf_runtime.py --source source --target target

      - name: Run port integrity and existing generic tests
        working-directory: target
        run: |
          python -m unittest runtime.overlay.tests.test_runtime_port_integrity -v
          python -m unittest runtime.overlay.tests.test_management_prompt -v
          python -m unittest runtime.overlay.tests.test_execution_handoff -v

      - name: Commit generated runtime to PR branch
        working-directory: target
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "observe-iterate-runtime-port"
          git config user.email "observe-iterate-runtime-port@users.noreply.github.com"
          git add runtime migration
          git commit -m "refactor: port full CYF runtime with professional references"
          git push origin HEAD:${{ github.head_ref }}
