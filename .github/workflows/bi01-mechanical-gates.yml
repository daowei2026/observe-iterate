name: BI-01 offline mechanical gates

on:
  push:
    branches:
      - fy/observation-iteration-v2-20261017
      - fy/bi01-v2-02-business-scene-20261018
      - fy/multisymbol-case-observation-20261027
    paths:
      - 'runtime/tools/**'
      - 'runtime/tests/**'
      - 'runtime/dual_route_execution/**'
      - 'runtime/config/**'
      - 'runtime/operations/**'
      - 'runtime/overlay/**'
      - 'professional/**'
      - '.github/workflows/bi01-mechanical-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile mechanical scripts
        run: python3 -m py_compile runtime/tools/bi01_run_gate.py runtime/overlay/tools/management_prompt.py runtime/overlay/tools/workmap_gate.py
      - name: Check configured method and non-sending interfaces
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = json.loads(Path('runtime/config/COORDINATOR_DISPATCH.json').read_text())['works']['BI-01']
          assert {'M-START','M-REASSESS','M-CLOSE','INDEPENDENT_REVIEW'} <= set(work['modes'])
          assert Path(work['goal_ref']['path']).is_file()
          assert work['goal_ref']['selector'] == 'full'
          binding = json.loads(Path('runtime/config/WORKMAP_BINDING.json').read_text())
          assert binding['schema'] == 'workmap-binding/v2'
          assert binding['status'] in {'NOT_CONFIGURED', 'ADOPTED'}
          for method in binding['rule_paths']:
              assert Path(method).is_file(), method
          PY
      - name: Run isolated synthetic Git round and source tests
        run: python3 -m unittest discover -s runtime/tests -p 'test_bi01_*.py' -v
      - name: Test current professional dispatch in synthetic Git repo
        run: python3 -m unittest discover -s runtime/overlay/tests -p 'test_bi01_pilot_smoke.py' -v
