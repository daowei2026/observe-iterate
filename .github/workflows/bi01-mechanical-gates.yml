name: BI-01 offline mechanical gates

on:
  push:
    branches:
      - fy/observation-iteration-v2-20261017
      - fy/bi01-v2-02-business-scene-20261018
    paths:
      - 'runtime/tools/bi01_run_gate.py'
      - 'runtime/tests/test_bi01_run_gate.py'
      - 'runtime/tests/test_bi01_workmap_consistency.py'
      - 'runtime/tests/test_bi01_v2_source_boundary.py'
      - 'runtime/dual_route_execution/**'
      - 'runtime/config/WORKMAP_BINDING.json'
      - 'runtime/operations/**'
      - 'runtime/overlay/00_README_当前运行入口.md'
      - 'runtime/overlay/13_角色回交与主控接续协议.md'
      - 'runtime/overlay/12_管理接收与地图校验.md'
      - 'runtime/overlay/13_角色回交与主控接续协议.md'
      - 'runtime/overlay/tools/question_work.schema.json'
      - 'runtime/config/COORDINATOR_DISPATCH.json'
      - 'runtime/overlay/08_自然语言运行提示_v0.3.md'
      - 'runtime/overlay/tests/test_bi01_pilot_smoke.py'
      - 'professional/v2/**'
      - '.github/workflows/bi01-mechanical-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile mechanical scripts
        run: python3 -m py_compile runtime/tools/bi01_run_gate.py runtime/overlay/tools/management_prompt.py runtime/overlay/tools/workmap_gate.py
      - name: Check BI-01 V2 three-step identifiers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema=json.loads(Path('runtime/overlay/tools/question_work.schema.json').read_text())
          names={'S1','S2','S3'}
          d=schema['$defs']
          assert names<=set(d['bindingV2']['properties']['question_ids']['items']['anyOf'][0]['enum'])
          assert names<=set(d['returnV2']['properties']['focus_results']['items']['properties']['question_id']['anyOf'][0]['enum'])
          modes=json.loads(Path('runtime/config/COORDINATOR_DISPATCH.json').read_text())['works']['BI-01']['modes']
          assert {'M-START','M-REASSESS','M-CLOSE','INDEPENDENT_REVIEW'}<=set(modes)
          assert {'OBSERVATION_SCOPE','OBSERVATION_CHART','OBSERVATION_IDEAS'}<=set(modes)
          assert not any(k in {'OBSERVATION_I1','OBSERVATION_I2','OBSERVATION_I3','OBSERVATION_I4','OBSERVATION_I5','OBSERVATION_I6'} for k in modes)
          assert json.loads(Path('runtime/config/WORKMAP_BINDING.json').read_text())['status']=='NOT_CONFIGURED'
          PY
      - name: Run isolated synthetic Git round tests
        run: python3 -m unittest discover -s runtime/tests -p 'test_bi01_*.py' -v
      - name: Test V2 professional dispatch in synthetic Git repo
        run: python3 -m unittest discover -s runtime/overlay/tests -p 'test_bi01_pilot_smoke.py' -v
