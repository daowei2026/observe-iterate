name: BI-01 offline dispatch smoke

on:
  push:
    branches:
      - fy/observation-iteration-v2-20261017
      - fy/bi01-v2-02-business-scene-20261018
      - fy/multisymbol-case-observation-20261027
    paths:
      - 'runtime/overlay/**'
      - 'runtime/config/COORDINATOR_DISPATCH.json'
      - 'professional/**'
      - '.github/workflows/bi01-offline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured bootstrap, bound dispatch and no-send guards
        run: python3 -m unittest discover -s runtime/overlay/tests -p 'test_bi01_pilot_smoke.py' -v
