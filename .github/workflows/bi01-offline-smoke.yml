name: BI-01 offline dispatch smoke

on:
  push:
    branches:
      - fix/full-cyf-runtime-copy-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify BI-01 bootstrap, bound dispatch and no-send guards
        run: python3 -m unittest discover -s runtime/overlay/tests -p 'test_bi01_pilot_smoke.py' -v
